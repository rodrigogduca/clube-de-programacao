<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Mesa de totó vista de cima">
  <!-- moldura de madeira -->
  <rect x="26" y="14" width="108" height="132" rx="10" fill="#6e4520"/>
  <rect x="32" y="20" width="96" height="120" rx="6" fill="#2f8f4e"/>
  <!-- linhas do campo -->
  <g stroke="#f6f1e9" stroke-width="2" fill="none" opacity=".75">
    <rect x="38" y="26" width="84" height="108" rx="2"/>
    <line x1="38" y1="80" x2="122" y2="80"/>
    <circle cx="80" cy="80" r="13"/>
    <rect x="62" y="26" width="36" height="14"/>
    <rect x="62" y="120" width="36" height="14"/>
  </g>
  <!-- gols -->
  <rect x="66" y="16" width="28" height="5" rx="2" fill="#15151b"/>
  <rect x="66" y="139" width="28" height="5" rx="2" fill="#15151b"/>
  <!-- varetas -->
  <g stroke="#c9c9d1" stroke-width="3.5" stroke-linecap="round">
    <line x1="10" y1="44" x2="150" y2="44"/>
    <line x1="10" y1="66" x2="150" y2="66"/>
    <line x1="10" y1="94" x2="150" y2="94"/>
    <line x1="10" y1="116" x2="150" y2="116"/>
  </g>
  <!-- manoplas -->
  <g fill="#15151b">
    <rect x="4" y="39" width="12" height="10" rx="4"/><rect x="144" y="61" width="12" height="10" rx="4"/>
    <rect x="4" y="89" width="12" height="10" rx="4"/><rect x="144" y="111" width="12" height="10" rx="4"/>
  </g>
  <!-- bonecos: laranja x azul -->
  <g fill="#ff5a1f">
    <rect x="56" y="38" width="10" height="12" rx="3"/><rect x="94" y="38" width="10" height="12" rx="3"/>
    <rect x="46" y="88" width="10" height="12" rx="3"/><rect x="75" y="88" width="10" height="12" rx="3"/><rect x="104" y="88" width="10" height="12" rx="3"/>
  </g>
  <g fill="#3b6fe0">
    <rect x="46" y="60" width="10" height="12" rx="3"/><rect x="75" y="60" width="10" height="12" rx="3"/><rect x="104" y="60" width="10" height="12" rx="3"/>
    <rect x="56" y="110" width="10" height="12" rx="3"/><rect x="94" y="110" width="10" height="12" rx="3"/>
  </g>
  <!-- bolinha -->
  <circle cx="88" cy="80" r="5" fill="#f6f1e9"/>
</svg>
