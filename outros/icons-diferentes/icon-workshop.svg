<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-label="Notebook com chave inglesa e engrenagem">
  <defs>
    <linearGradient id="lar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb52e"/>
      <stop offset="1" stop-color="#fb5b00"/>
    </linearGradient>
    <path id="engrenagem" d="M0-44l9 0 3 12 10 4 11-6 7 7-6 11 4 10 12 3 0 9-12 3-4 10 6 11-7 7-11-6-10 4-3 12-9 0-3-12-10-4-11 6-7-7 6-11-4-10-12-3 0-9 12-3 4-10-6-11 7-7 11 6 10-4z"/>
    <g id="desenho">
      <!-- tela -->
      <rect x="50" y="40" width="200" height="136" rx="14"/>
      <!-- base -->
      <path d="M24 186h252l-14 30H38z"/>
      <!-- engrenagem -->
      <use href="#engrenagem" transform="translate(262 70)"/>
      <!-- chave inglesa -->
      <path d="M70 220l86-86" />
      <circle cx="166" cy="124" r="28"/>
    </g>
  </defs>

  <g fill="#fb5b00" stroke="#fb5b00" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"><use href="#desenho"/></g>
  <g fill="#000" stroke="#000" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"><use href="#desenho"/></g>

  <!-- tela -->
  <rect x="50" y="40" width="200" height="136" rx="14" fill="#29282c"/>
  <g stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M78 76h54" stroke="#fb5b00"/>
    <path d="M78 98h92" stroke="#fae4c8"/>
    <path d="M96 120h60" stroke="#ffb52e"/>
    <path d="M78 142h40" stroke="#fae4c8" opacity=".7"/>
  </g>
  <path d="M60 52h40" stroke="#fae4c8" stroke-width="4" stroke-linecap="round" opacity=".5"/>

  <!-- base -->
  <path d="M24 186h252l-14 30H38z" fill="#fae4c8"/>
  <path d="M130 196h40" stroke="#29282c" stroke-width="6" stroke-linecap="round"/>

  <!-- engrenagem -->
  <use href="#engrenagem" transform="translate(262 70)" fill="url(#lar)"/>
  <circle cx="262" cy="70" r="14" fill="#29282c"/>
  <circle cx="262" cy="70" r="6" fill="#fae4c8"/>

  <!-- chave inglesa -->
  <path d="M70 220l86-86" stroke="#fae4c8" stroke-width="18" stroke-linecap="round"/>
  <circle cx="166" cy="124" r="28" fill="#fae4c8"/>
  <path d="M170 90l14 14-10 10-14-14z M196 112l-14 14" fill="#29282c" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
  <path d="M168 96l16 16 10-10-16-16z" fill="#29282c"/>
  <circle cx="160" cy="130" r="6" fill="#fb5b00"/>
  <path d="M86 204l52-52" stroke="#fb5b00" stroke-width="5" stroke-linecap="round" opacity=".8"/>
